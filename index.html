<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentACar.com - Car Rental</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50">
    
    <!-- HEADER -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 bg-red-600 text-white font-black text-4xl flex items-center justify-center rounded-xl">R</div>
                <div>
                    <span class="text-3xl font-bold tracking-tight">RentACar</span>
                    <span class="text-xs block -mt-1 text-gray-500">.com</span>
                </div>
            </div>

            <nav class="hidden md:flex items-center gap-8 text-sm font-medium">
                <a href="#" class="hover:text-red-600">Cars</a>
                <a href="#" class="hover:text-red-600">Deals</a>
                <a href="#" class="hover:text-red-600">Locations</a>
                <a href="#" class="hover:text-red-600">How it Works</a>
            </nav>

            <div class="flex items-center gap-4">
                <button onclick="toggleLogin()" class="px-6 py-2.5 text-sm font-medium hover:bg-gray-100 rounded-xl">Sign in</button>
                <button onclick="toggleLogin()" class="bg-red-600 text-white px-6 py-2.5 rounded-xl font-medium hover:bg-red-700">Become a Host</button>
            </div>
        </div>
    </header>

    <!-- HERO SEARCH -->
    <div class="bg-gradient-to-br from-red-600 to-rose-700 text-white py-20">
        <div class="max-w-5xl mx-auto px-6 text-center">
            <h1 class="text-5xl font-bold mb-4">Find your next adventure on wheels</h1>
            <p class="text-xl mb-10">Rent cars easily from trusted hosts worldwide</p>
            
            <div class="bg-white rounded-3xl p-2 shadow-2xl max-w-4xl mx-auto">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 p-2">
                    <div class="col-span-2">
                        <label class="block text-gray-600 text-sm font-medium mb-1 px-4">Pickup Location</label>
                        <input id="location" type="text" placeholder="City or Airport" 
                               class="w-full px-6 py-4 rounded-2xl border border-gray-300 focus:outline-none focus:border-red-500">
                    </div>
                    <div>
                        <label class="block text-gray-600 text-sm font-medium mb-1 px-4">Pickup Date</label>
                        <input id="pickup" type="date" class="w-full px-6 py-4 rounded-2xl border border-gray-300 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-gray-600 text-sm font-medium mb-1 px-4">Return Date</label>
                        <input id="return" type="date" class="w-full px-6 py-4 rounded-2xl border border-gray-300 focus:outline-none">
                    </div>
                </div>
                <button onclick="searchCars()" 
                        class="mt-4 w-full md:w-auto bg-red-600 hover:bg-red-700 transition text-white font-semibold px-14 py-4 rounded-2xl text-lg flex items-center gap-3 mx-auto">
                    <i class="fas fa-search"></i>
                    Search Cars
                </button>
            </div>
        </div>
    </div>

    <!-- FEATURED CARS -->
    <div class="max-w-7xl mx-auto px-6 py-12">
        <h2 class="text-3xl font-bold mb-8 flex items-center gap-3">
            <i class="fas fa-car"></i>
            Featured Rental Cars
        </h2>
        
        <div id="car-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Populated by JS -->
        </div>
    </div>

    <!-- BOOKING MODAL -->
    <div id="booking-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full overflow-hidden">
            <div class="p-8">
                <h3 class="text-2xl font-bold mb-6" id="modal-car-name"></h3>
                <div id="modal-car-image" class="rounded-2xl overflow-hidden mb-6"></div>
                
                <div class="space-y-5">
                    <div class="flex justify-between text-lg">
                        <span class="text-gray-600">Daily Price</span>
                        <span class="font-bold" id="modal-price"></span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-600">Pickup</span>
                        <span id="modal-pickup"></span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-600">Return</span>
                        <span id="modal-return"></span>
                    </div>
                    <div class="border-t pt-4 flex justify-between text-xl font-bold">
                        <span>Total</span>
                        <span id="modal-total"></span>
                    </div>
                </div>

                <button onclick="confirmBooking()" 
                        class="w-full mt-10 bg-green-600 hover:bg-green-700 text-white py-4 rounded-2xl font-semibold text-lg">
                    Confirm Booking
                </button>
                
                <button onclick="closeModal()" 
                        class="w-full mt-3 text-gray-500 hover:text-gray-700 py-3 font-medium">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
